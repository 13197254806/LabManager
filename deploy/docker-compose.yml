# 所有配置都在同一个 .env 文件里。每个容器只拿到自己需要的变量
# （平台容器拿不到校园网密码，tunnel 容器拿不到飞书 Secret）。

x-app-env: &app-env
  DATABASE_URL: sqlite:////data/lab.db
  LAB_NAME: ${LAB_NAME:-实验室}
  BASE_URL: ${BASE_URL:-}
  SECRET_KEY: ${SECRET_KEY:?请在 .env 里设置 SECRET_KEY}
  FEISHU_APP_ID: ${FEISHU_APP_ID:-}
  FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
  FEISHU_TENANT_KEY: ${FEISHU_TENANT_KEY:-}
  WELCOME_CHAT_IDS: ${WELCOME_CHAT_IDS:-}
  MAX_RESERVATION_DAYS: ${MAX_RESERVATION_DAYS:-14}
  MAX_ADVANCE_DAYS: ${MAX_ADVANCE_DAYS:-30}
  MAX_GPU_SHARERS: ${MAX_GPU_SHARERS:-3}
  REMINDER_HOUR: ${REMINDER_HOUR:-20}
  TZ_NAME: ${TZ_NAME:-Asia/Shanghai}
  DEV_LOGIN: ${DEV_LOGIN:-0}
  TUNNEL_TARGETS: ${TUNNEL_TARGETS:-}
  # 首次部署 GPU 服务器用（平台把这些通过 /agent/bootstrap-config 返回给 Mac 上的 bootstrap 脚本）
  CHISEL_PORT: ${CHISEL_PORT:-9000}
  CHISEL_SECRET: ${CHISEL_SECRET:-}
  CHISEL_ALLOW: ${CHISEL_ALLOW:-59.69.127.0/24}
  REMOTE_PLATFORM_PORT: ${REMOTE_PLATFORM_PORT:-18765}

# 容器日志轮转：Docker 默认不限大小，隧道每条 chisel 日志都会写进去，跑上几个月会把磁盘写满
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 所有服务都是 restart: unless-stopped：服务器重启 / 进程崩溃后由 Docker 自动拉起（Docker 本身由 systemd 开机自启）
x-app: &app
  image: lab-server:latest
  environment: *app-env
  volumes:
    - ./data:/data
  restart: unless-stopped
  logging: *logging

services:
  web:
    <<: *app
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR-mirrors.cloud.tencent.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL-https://mirrors.cloud.tencent.com/pypi/simple}
    # 只监听服务器本机：需要时可以 ssh -L 18080:127.0.0.1:8080 转发到自己电脑上访问
    ports:
      - "127.0.0.1:8080:8000"
    # 健康检查：docker compose ps 能看到 healthy / unhealthy（卡死时一眼就能发现）
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 飞书机器人（长连接收事件）
  bot:
    <<: *app
    command: ["python", "-m", "app.bot"]
    pull_policy: never   # 与 web 共用同一个本地构建的镜像
    depends_on: [web]

  # 校园网隧道：登录 WebVPN（支持 WebSocket），经它用 chisel 连到各 GPU 服务器建反向隧道。
  # 家宽代理：mihomo 把 .env 里的 ss 家宽节点变成本机代理（proxy:7891）。
  # 学校 WebVPN 封了云服务器 IP，隧道经它出口访问，让 WebVPN 看到家宽 IP。
  # 配置由 gen-proxy-config.py 从 .env 的 WEBVPN_PROXY_NODES 生成到 data/proxy/config.yaml。
  proxy:
    image: ${MIHOMO_IMAGE:-metacubex/mihomo:latest}
    container_name: lab-proxy
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./data/proxy:/root/.config/mihomo
    profiles: [campus]

  tunnel:
    <<: *app
    command: ["python", "-m", "app.tunnel", "run"]
    pull_policy: never
    # 只给隧道自己需要的变量：校园网密码只在这里，飞书 Secret、登录 Cookie 签名密钥不进这个容器
    environment:
      DATABASE_URL: sqlite:////data/lab.db
      TZ_NAME: ${TZ_NAME:-Asia/Shanghai}
      TUNNEL_TARGETS: ${TUNNEL_TARGETS:-}
      CHISEL_PORT: ${CHISEL_PORT:-9000}
      CHISEL_SECRET: ${CHISEL_SECRET:-}
      REMOTE_PLATFORM_PORT: ${REMOTE_PLATFORM_PORT:-18765}
      WEBVPN_PORTAL: ${WEBVPN_PORTAL:-https://webvpn.whut.edu.cn}
      WEBVPN_USER: ${WEBVPN_USER:-}
      WEBVPN_PASSWORD: ${WEBVPN_PASSWORD:-}
      WEBVPN_PROXY: ${WEBVPN_PROXY:-http://proxy:7891}
      PLATFORM_ADDR: web:8000
      CHISEL_FINGERPRINT: ${CHISEL_FINGERPRINT:-}
    depends_on: [web, proxy]
    profiles: [campus]

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 里设置 DOMAIN}
      HTTP_SITE: ${HTTP_SITE:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
